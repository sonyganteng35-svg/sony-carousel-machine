name: Weekly Carousel Machine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

jobs:
  generate-carousel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Carousel AI Agent
        run: |
          python agents/main_agent.py

      - name: Show output
        run: |
          ls output
