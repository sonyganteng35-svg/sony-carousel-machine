name: Weekly Carousel Machine

on:
  workflow_dispatch:

jobs:
  generate-carousel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Carousel AI Agent
        run: |
          python agents/main_agent.py

      - name: Show output
        run: |
          ls output

      - name: Save generated output
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add output/
          git commit -m "Generate carousel output" || exit 0
          git push
